<!DOCTYPE html>
<html>
<head>
    <title>賞味期限管理</title>
</head>
<body>

<h1>賞味期限管理アプリ</h1>

<form method="POST">
    <input type="text" name="name" placeholder="食品名">
    <input type="date" name="date">
    <button type="submit">登録</button>
</form>
<h2>登録した食品</h2>

<ul>
    {% for food in foods %}
        <li>{{ food[1] }}：{{ food[2] }}</li>
    {% endfor %}
</ul>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>賞味期限管理</title>
</head>
<body>

<h1>賞味期限管理アプリ</h1>

{% if error %}
    <p style="color: red;">{{ error }}</p>
{% endif %}

<form method="POST">
    <input type="text" name="name" placeholder="食品名" required>
    <input type="date" name="open_date" required>
    <input type="number" name="days" placeholder="保存日数" min="1" required>
    <button type="submit">登録</button>
</form>
<h2>登録した食品</h2>

<ul>
    {% for food in foods %}
        <li>
            <form action="/edit/{{ food[0] }}" method="POST" style="display:inline;">
                <input type="text" name="name" value="{{ food[1] }}">
                <input type="date" name="date" value="{{ food[2] }}">
                <button type="submit">更新</button>
            </form>
            
            <form action="/delete/{{ food[0] }}" method="POST" style="display:inline;">
                <button type="submit">削除</button>
            </form>
        </li>
    {% endfor %}
</ul>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>賞味期限管理</title>
</head>
<body>

<h1>賞味期限管理アプリ</h1>

{% if error %}
    <p style="color: red;">{{ error }}</p>
{% endif %}

<form method="POST">
    <input type="text" name="name" placeholder="食品名" required>
    <input type="date" name="open_date" required>
    <input
        type="number"
        name="days"
        placeholder="保存日数"
        min="1"
        max="{{ max_shelf_life_days }}"
        required
    >
    <button type="submit">登録</button>
</form>

{% if ai_guidance_text %}
    <h2>AIによる確認ポイント</h2>
    <p style="white-space: pre-line;">{{ ai_guidance_text }}</p>
{% endif %}

<h2>登録した食品</h2>

<ul>
    {% for food in foods %}
        <li>
            <form action="/edit/{{ food.id }}" method="POST" style="display:inline;">
                <input type="text" name="name" value="{{ food.name }}">
                <input type="date" name="date" value="{{ food.expiry_date }}">

                <span>
                    状態：{{ food.expiry_status }}
                </span>

                <button type="submit">更新</button>
            </form>

            <form action="/delete/{{ food.id }}" method="POST" style="display:inline;">
                <button type="submit">削除</button>
            </form>
            {% if food.expiry_status in ["期限切れ", "期限間近"] %}
                <form action="/ai-guidance/{{ food.id }}" method="POST" style="display:inline;">
                    <button type="submit">AIで確認ポイント</button>
                </form>
            {% endif %}
        </li>
    {% endfor %}
</ul>

</body>
</html>
